name: Build MiniPOS Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe) - Moderno
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        working-directory: ./MiniPOS_portable
        run: pyinstaller --noconsole --onefile --paths=src --icon="miniPOS_portable.ico" --name="miniPOS_portable-v2.5" main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniPOS_portable-windows
          path: MiniPOS_portable/dist/miniPOS_portable-v2.5.exe

  build-windows7:
    name: Build Windows 7 SP1 (.exe) - Compatible
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win7.txt

      - name: Build EXE for Windows 7
        working-directory: ./MiniPOS_portable
        run: pyinstaller --noconsole --onefile --paths=src --icon="miniPOS_portable.ico" --name="miniPOS_portable-v2.5-win7" main.py

      - name: Upload Windows 7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniPOS_portable-windows7
          path: MiniPOS_portable/dist/miniPOS_portable-v2.5-win7.exe

  build-linux-appimage:
    name: Build Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk wget file

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        working-directory: ./MiniPOS_portable
        run: pyinstaller --onefile --paths=src --name="miniPOS_portable-v2.5" main.py

      - name: Download linuxdeploy
        working-directory: ./MiniPOS_portable
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-extracted

      - name: Build AppImage
        working-directory: ./MiniPOS_portable
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications
          cp dist/miniPOS_portable-v2.5 AppDir/usr/bin/

          cp miniPOS_portable.png AppDir/usr/share/icons/hicolor/256x256/apps/miniPOS_portable.png
          cp miniPOS_portable.png AppDir/miniPOS_portable.png

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          exec "$APPDIR/usr/bin/miniPOS_portable-v2.5" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/usr/share/applications/miniPOS_portable.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=MiniPOS Portable
          Exec=miniPOS_portable-v2.5
          Icon=miniPOS_portable
          Categories=Utility;
          Terminal=false
          EOF
          cp AppDir/usr/share/applications/miniPOS_portable.desktop AppDir/miniPOS_portable.desktop

          ./linuxdeploy-extracted/AppRun --appdir AppDir --output appimage

      - name: Rename AppImage
        working-directory: ./MiniPOS_portable
        run: |
          echo "=== Archivos AppImage generados ==="
          ls -la *.AppImage
          # Renombrar cualquier AppImage generado a un nombre fijo
          for f in *.AppImage; do
            if [ -f "$f" ]; then
              mv "$f" miniPOS_portable-v2.5-x86_64.AppImage
              echo "Renombrado: $f -> miniPOS_portable-v2.5-x86_64.AppImage"
            fi
          done
          echo "=== Archivo final ==="
          ls -la miniPOS_portable-v2.5-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniPOS_portable-linux-appimage
          path: MiniPOS_portable/miniPOS_portable-v2.5-x86_64.AppImage

  release:
    name: Create Release
    needs: [build-windows, build-windows7, build-linux-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: miniPOS_portable-windows
          path: ./release/windows

      - name: Download Windows 7 artifact
        uses: actions/download-artifact@v4
        with:
          name: miniPOS_portable-windows7
          path: ./release/windows7

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: miniPOS_portable-linux-appimage
          path: ./release/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/windows/miniPOS_portable-v2.5.exe
            ./release/windows7/miniPOS_portable-v2.5-win7.exe
            ./release/linux/miniPOS_portable-v2.5-x86_64.AppImage
          generate_release_notes: true
